<div
  style="
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 28px 18px;
  "
>
  <div class="ti-card" style="width: min(520px, 100%); padding: 22px 22px 18px;">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
      <div>

        <h1 style="margin: 10px 0 4px; font-size: 22px; letter-spacing: -0.02em;">
          Primary key infrastructure
        </h1>
        <p style="margin: 0; color: var(--text-2); font-size: 13px;">
          Authenticate to issue and inspect certificates.
        </p>
      </div>
    </div>

    <hr style="border: 0; border-top: 1px solid var(--border); margin: 16px 0;" />

    <form (ngSubmit)="submit()" [formGroup]="form" style="display: grid; gap: 12px;">
      <label style="display: grid; gap: 6px;">
        <span style="color: var(--text-2); font-size: 12px;">Email</span>
        <input
          class="ti-input ti-mono"
          type="email"
          autocomplete="username"
          placeholder="user@ib.local"
          formControlName="email"
        />
      </label>

      <label style="display: grid; gap: 6px;">
        <span style="color: var(--text-2); font-size: 12px;">Password</span>
        <input
          class="ti-input ti-mono"
          type="password"
          autocomplete="current-password"
          placeholder="••••••••"
          formControlName="password"
        />
      </label>

      @if (error()) {
        <div
          class="ti-card"
          style="
            padding: 10px 12px;
            border-color: rgba(248, 81, 73, 0.35);
            background: rgba(248, 81, 73, 0.06);
          "
          role="alert"
        >
          <div class="ti-mono" style="color: var(--critical); font-size: 12px;">
            {{ error() }}
          </div>
        </div>
      }

      <button class="ti-btn" type="submit" [disabled]="busy()">
        @if (busy()) { Authenticating… } @else { Sign in }
      </button>
    </form>
  </div>
</div>
