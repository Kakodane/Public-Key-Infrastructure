<div class="page">
  <div class="ti-card card">
    <div>
      <div class="ti-pill ti-mono ti-pill--info">recovery</div>
      <h1 class="card__title">Forgot password</h1>
      <p class="card__subtitle">
        Enter your email and we'll send a recovery link if an account exists.
      </p>
    </div>

    <hr class="divider" />

    @if (submitted()) {
      <div class="ti-card success-box">
        <div class="ti-mono ti-ok">
          If an account exists for that email, a recovery link has been sent.
          Check your inbox.
        </div>
        <p style="margin-top: 12px; font-size: 12px;">
          <a routerLink="/login">Back to login</a>
        </p>
      </div>
    } @else {
      <form (ngSubmit)="submit()" [formGroup]="form" class="form">
        <label class="field">
          <span class="field__label">Email</span>
          <input
            class="ti-input ti-mono"
            type="email"
            autocomplete="email"
            placeholder="user@example.com"
            formControlName="email"
          />
          @if (emailErrors) {
            <span class="field-error">{{ emailErrors }}</span>
          }
        </label>

        <button class="ti-btn" type="submit" [disabled]="busy()">
          @if (busy()) { Sending… } @else { Send recovery link }
        </button>

        <div style="text-align: center; font-size: 12px; color: var(--muted); margin-top: 4px;">
          <a routerLink="/login">Back to login</a>
        </div>
      </form>
    }
  </div>
</div>
