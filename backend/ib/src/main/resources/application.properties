spring.application.name=ib

server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore/keystore_server.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${KEYSTORE_PASSWORD}
server.ssl.key-alias=${KEYSTORE_ALIAS:localhost}

spring.datasource.url=jdbc:postgresql://localhost:5432/ib
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Include @ResponseStatus message and validation errors in error response body
server.error.include-message=always
server.error.include-binding-errors=always

jwt.secret=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
jwt.access-ttl=PT15M
jwt.refresh-ttl=P7D

# DEV PLACEHOLDER
crypto.master-key-base64=${MASTER_KEY_BASE64:ZGV2LW1hc3Rlci1rZXktRE8tTk9ULVVTRS1QUk9EISE=}
crypto.master-key-rotation-enabled=true
crypto.master-key-rotation-cron=0 0 2 1 */6 *
crypto.master-key-rotation-batch-size=50

#SendGrid
sendgrid.api.key=${SENDGRID_API_KEY}
app.mail.from=ssajapaja5@gmail.com


app.frontend.url=https://localhost:4200
app.crl.base-url=https://localhost:8443/api/crl
app.crl.next-update-days=1
app.crl.refresh-cron=0 0 3 * * *