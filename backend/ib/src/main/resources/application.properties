spring.application.name=ib

spring.datasource.url=jdbc:h2:mem:ib;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

jwt.secret=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
jwt.access-ttl=PT15M
jwt.refresh-ttl=P7D

# DEV PLACEHOLDER
crypto.master-key-base64=${MASTER_KEY_BASE64:ZGV2LW1hc3Rlci1rZXktRE8tTk9ULVVTRS1QUk9EISE=}
