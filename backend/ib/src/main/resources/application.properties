spring.application.name=ib

spring.datasource.url=jdbc:postgresql://localhost:5432/ib
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Include @ResponseStatus message and validation errors in error response body
server.error.include-message=always
server.error.include-binding-errors=always

jwt.secret=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
jwt.access-ttl=PT15M
jwt.refresh-ttl=P7D

# DEV PLACEHOLDER
crypto.master-key-base64=${MASTER_KEY_BASE64:ZGV2LW1hc3Rlci1rZXktRE8tTk9ULVVTRS1QUk9EISE=}

#SendGrid
sendgrid.api.key=${SENDGRID_API_KEY}
app.mail.from=ssajapaja5@gmail.com


app.frontend.url=http://localhost:4200